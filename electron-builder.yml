appId: app.quoba.desktop
productName: Quoba
copyright: Copyright © 2026 jyuuuuu0
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
# @autorag/librarian은 별도 프로세스(CLI)로도 실행되므로 asar 밖에 둔다
asarUnpack:
  - node_modules/@autorag/**
  - resources/**
extraResources:
  - from: resources/brand
    to: brand
mac:
  category: public.app-category.productivity
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  # 인증서가 없어서 ad-hoc 서명. Apple silicon은 서명 없는 앱을 실행하지 않는다.
  # hardened runtime은 ad-hoc 서명과 함께 쓰면 Electron 프레임워크 로딩이 막히므로 끈다.
  # Developer ID 인증서를 쓰게 되면 identity를 지우고 hardenedRuntime을 다시 켠다.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target: [AppImage]
  category: Office
publish: null
